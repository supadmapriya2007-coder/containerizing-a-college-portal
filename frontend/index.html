<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>College Portal</h1>
    <p>Containerizing a College Portal</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Welcome</h2>
      <p>This is the starter version of the College Portal.</p>
      <div class="buttons">
        <button onclick="showMessage('Student Portal selected')">Student Portal</button>
        <button onclick="showMessage('Faculty Portal selected')">Faculty Portal</button>
        <button onclick="showMessage('Admin Portal selected')">Admin Portal</button>
      </div>
      <p id="message"></p>
    </section>
  </main>

  <footer>
    <p>College Portal &copy; 2026</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
