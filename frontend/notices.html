<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Notices</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>🎓 College Portal</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="student.html">Student</a>
        <a href="#">Faculty</a>
        <a href="#">Admin</a>
    </nav>
</header>

<main>

    <section class="hero">
        <h2>📢 College Notices</h2>
        <p>Latest announcements and important college information.</p>
    </section>

    <section class="cards" id="noticeList">
        <p>Loading notices...</p>
    </section>

</main>

<footer>
    <p>© 2026 College Portal | Containerizing a College Portal</p>
</footer>

<script>

fetch("http://localhost:3000/api/notices")
    .then(response => response.json())
    .then(notices => {

        const noticeList = document.getElementById("noticeList");

        noticeList.innerHTML = "";

        notices.forEach(notice => {

            const card = document.createElement("div");

            card.className = "card";

            card.innerHTML = `
                <h3>📢 ${notice.title}</h3>
                <p>${notice.message}</p>
                <button>Read More</button>
            `;

            noticeList.appendChild(card);

        });

    })
    .catch(error => {

        document.getElementById("noticeList").innerHTML =
            "<p>Backend server is not running.</p>";

    });

</script>

</body>
</html>
