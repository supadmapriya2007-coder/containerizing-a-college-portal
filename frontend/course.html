<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Courses</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>📚 Courses</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="student.html">Student</a>
            <a href="#">Faculty</a>
            <a href="#">Admin</a>
        </nav>
    </header>


    <main>

        <section class="hero">

            <h2>My Courses</h2>

            <p>
                View your registered subjects.
            </p>

        </section>


        <!-- Courses will be loaded from the backend -->

        <section class="cards" id="courseList">

            <p>Loading courses...</p>

        </section>

    </main>


    <footer>

        <p>© 2026 College Portal | Courses</p>

    </footer>


    <script>

        fetch("http://localhost:3000/api/courses")

            .then(response => response.json())

            .then(courses => {

                const courseList =
                    document.getElementById("courseList");

                courseList.innerHTML = "";

                courses.forEach(course => {

                    const card =
                        document.createElement("div");

                    card.className = "card";

                    card.innerHTML = `
                        <h3>📚 ${course.name}</h3>

                        <p>
                            Course Code: ${course.code}
                        </p>

                        <button>
                            View Course
                        </button>
                    `;

                    courseList.appendChild(card);

                });

            })

            .catch(error => {

                document.getElementById("courseList").innerHTML =
                    "<p>Backend server is not running.</p>";

            });

    </script>

</body>

</html>
