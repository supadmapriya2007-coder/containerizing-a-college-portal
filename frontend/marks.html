<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marks</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>📊 Marks</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="student.html">Student</a>
            <a href="#">Faculty</a>
            <a href="#">Admin</a>
        </nav>
    </header>


    <main>

        <section class="hero">

            <h2>My Marks</h2>

            <p>
                Check your internal marks and examination results.
            </p>

        </section>


        <!-- Marks will be loaded from the backend -->

        <section class="cards" id="marksList">

            <p>Loading marks...</p>

        </section>

    </main>


    <footer>

        <p>© 2026 College Portal | Marks</p>

    </footer>


    <script>

        fetch("http://localhost:3000/api/marks")

            .then(response => response.json())

            .then(marks => {

                const marksList =
                    document.getElementById("marksList");

                marksList.innerHTML = "";

                marks.forEach(item => {

                    const card =
                        document.createElement("div");

                    card.className = "card";

                    card.innerHTML = `
                        <h3>📚 ${item.subject}</h3>

                        <p>
                            Mark: <strong>${item.mark}</strong> / 100
                        </p>

                        <button>
                            View Result
                        </button>
                    `;

                    marksList.appendChild(card);

                });

            })

            .catch(error => {

                document.getElementById("marksList").innerHTML =
                    "<p>Backend server is not running.</p>";

            });

    </script>

</body>

</html>
